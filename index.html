<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sounds Right</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a small town square seen like a stage. A booth with a robot in costume, a curious citizen on the left, a crowd that grows as belief grows, and a curtained Truth Booth that opens at the end. Chunky outlines, hard shadows, sticker buttons. */
:root {
  --ink: #2b2a33;
  --paper: #fffaf0;
  --bg: #f1e7d2;
  --sky: #cfe3ea;
  --ground: #e9d8b4;
  --rose: #d9847a;
  --teal: #5aa6a6;
  --ochre: #e3b45f;
  --sage: #8fb88a;
  --slate: #6b7fa3;
  --mauve: #8d77a8;
  --wood: #b98b5e;
  --display: "Fredoka", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; }
body { min-height: 100%; background-image: radial-gradient(rgba(43,42,51,.07) 1.5px, transparent 1.5px); background-size: 22px 22px; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 4px solid var(--slate); outline-offset: 3px; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 18px 18px 72px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 14px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .02em; }
.brand small { font-family: var(--body); font-weight: 800; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; background: var(--ink); color: var(--paper); border-radius: 6px; padding: 2px 7px; margin-left: 8px; vertical-align: 3px; }
.linkbtn { background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; padding: 4px 14px; font-weight: 800; font-size: 14px; box-shadow: 0 3px 0 var(--ink); }
.linkbtn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }

/* sticker UI */
.sticker { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink); }
.btn { background: var(--rose); color: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 12px 28px; font-family: var(--display); font-weight: 700; font-size: 22px; box-shadow: 0 6px 0 var(--ink); text-shadow: 0 2px 0 rgba(43,42,51,.35); transition: transform .08s ease, box-shadow .08s ease; }
.btn:hover:not([disabled]) { transform: translateY(-2px); box-shadow: 0 8px 0 var(--ink); }
.btn:active:not([disabled]) { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.btn[disabled] { background: #c9bfae; color: #fff; cursor: not-allowed; box-shadow: 0 3px 0 var(--ink); text-shadow: none; }
.btn.alt { background: var(--paper); color: var(--ink); text-shadow: none; }
.stage { position: relative; border: 4px solid var(--ink); border-radius: 22px; overflow: hidden; box-shadow: 0 8px 0 var(--ink); background: var(--sky); }
.stage svg { display: block; width: 100%; height: auto; }
.pop { position: absolute; left: 50%; top: 10%; margin-left: -60px; font-family: var(--display); font-weight: 700; font-size: 30px; color: #fff; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); animation: floatup 1.4s ease-out forwards; pointer-events: none; white-space: nowrap; }
.pop.up { color: #a6d99a; } .pop.down { color: #f2a79c; } .pop.heart { color: #f48fa0; left: 62%; animation-delay: .15s; }
@keyframes floatup { 0% { transform: translateY(16px) scale(.6); opacity: 0; } 15% { opacity: 1; transform: translateY(0) scale(1.15); } 100% { transform: translateY(-70px) scale(1); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(40px); } }
@keyframes pop-in { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes wiggle { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes wave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-25deg); } }
.bob { animation: bob 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.bob2 { animation: bob 3s ease-in-out infinite .6s; transform-box: fill-box; transform-origin: 50% 100%; }
.cloud { animation: drift 14s ease-in-out infinite alternate; }
.cloud.b { animation-duration: 19s; animation-direction: alternate-reverse; }
.newc { animation: pop-in .5s ease-out both; transform-box: fill-box; transform-origin: 50% 100%; }
.shake { animation: shake .4s ease; }
.waver { transform-box: fill-box; transform-origin: 0% 100%; animation: wave 1.2s ease-in-out infinite; }
.curtain { transition: transform .9s cubic-bezier(.6,.0,.2,1); }
.open .cl { transform: translateX(-92px); } .open .cr { transform: translateX(92px); }

/* intro */
.hero { text-align: center; padding: 30px 0 22px; }
.title { font-family: var(--display); font-weight: 700; font-size: clamp(54px, 12vw, 118px); line-height: .92; color: var(--paper); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink); letter-spacing: .01em; margin: 6px 0 4px; transform: rotate(-2deg); }
.title em { font-style: normal; color: var(--rose); }
.lead { font-size: clamp(18px, 2.4vw, 22px); font-weight: 700; max-width: 30em; margin: 18px auto 22px; }
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 26px 0; }
.how div { padding: 14px 16px; font-weight: 700; }
.how b { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--paper); font-family: var(--display); margin-right: 8px; }
.fine { font-size: 14px; color: #6f6a62; font-weight: 700; margin-top: 12px; }

/* pick */
.pick h2 { font-size: clamp(32px, 5vw, 48px); text-align: center; }
.pick .sub { text-align: center; font-weight: 700; margin: 6px auto 0; max-width: 34em; }
.idgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
.idcard { text-align: left; padding: 0; overflow: hidden; display: flex; flex-direction: column; transition: transform .12s ease, box-shadow .12s ease; }
.idcard:hover { transform: translateY(-5px) rotate(-.6deg); box-shadow: 0 11px 0 var(--ink); }
.idcard .art { background: var(--c); border-bottom: 3px solid var(--ink); display: grid; place-items: center; padding: 10px 0 0; }
.idcard .art svg { width: 62%; max-width: 190px; height: auto; display: block; }
.idcard:hover .art svg { animation: wiggle .5s ease-in-out infinite; }
.idcard .txt { padding: 16px 18px 18px; display: grid; gap: 10px; }
.tag { align-self: flex-start; font-weight: 800; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--ink); border-radius: 999px; padding: 2px 12px; }
.idcard h3 { font-size: 24px; line-height: 1.1; }
.idcard .lim { font-weight: 700; font-size: 16px; }
.idcard dl { margin: 0; display: grid; gap: 6px; font-size: 14px; }
.idcard dt { font-weight: 800; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: #6f6a62; }
.idcard dd { margin: 0; font-weight: 600; }

/* play */
.hud { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; margin-bottom: 14px; }
.belief { padding: 10px 14px 12px; }
.belief .lab { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
.belief .lab span { font-size: 26px; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 20px; border: 3px solid var(--ink); border-radius: 999px; background: #e5dccb; margin-top: 8px; overflow: visible; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--rose); transition: width .6s cubic-bezier(.2,.8,.2,1); border-right: 3px solid var(--ink); }
.bar .goal { position: absolute; top: -12px; bottom: -12px; width: 4px; background: var(--ink); border-radius: 2px; }
.bar .goal i { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-style: normal; font-family: var(--display); font-size: 12px; white-space: nowrap; background: var(--ink); color: var(--paper); border-radius: 6px; padding: 0 6px; }
.likes { padding: 8px 16px; display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 24px; }
.likes svg { width: 30px; height: 30px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.crumb { font-family: var(--display); font-weight: 600; font-size: 13px; padding: 3px 12px; border-radius: 999px; border: 2.5px solid var(--ink); background: var(--paper); color: #6f6a62; }
.crumb.on { background: var(--c); color: #fff; text-shadow: 0 1px 0 rgba(43,42,51,.4); box-shadow: 0 3px 0 var(--ink); }
.crumb.done { color: var(--ink); background: #efe6d4; }
.below { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; margin-top: 26px; align-items: start; }
.talk { display: grid; grid-template-columns: 78px 1fr; gap: 12px; align-items: start; }
.avatar { width: 78px; height: 78px; border: 3px solid var(--ink); border-radius: 50%; background: var(--c); overflow: hidden; box-shadow: 0 4px 0 var(--ink); }
.avatar svg { width: 100%; height: 100%; display: block; }
.say { position: relative; padding: 14px 18px; font-size: 19px; font-weight: 700; line-height: 1.4; }
.say::before { content: ""; position: absolute; left: -13px; top: 22px; width: 20px; height: 20px; background: var(--paper); border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg); }
.say small { display: block; font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #6f6a62; margin-bottom: 4px; }
.prompt { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 20px 0 10px; }
.opts { display: grid; gap: 12px; }
.opt { text-align: left; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; padding: 12px 16px; display: grid; gap: 2px; box-shadow: 0 5px 0 var(--ink); transition: transform .08s ease, box-shadow .08s ease, background .08s ease; }
.opt:hover:not(.lock) { transform: translateY(-2px); box-shadow: 0 7px 0 var(--ink); background: #fff; }
.opt:active:not(.lock) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.opt b { font-family: var(--display); font-weight: 600; font-size: 19px; }
.opt span { font-weight: 600; font-size: 15px; color: #5d5850; }
.opt.lock { background: repeating-linear-gradient(135deg, #e6dccb, #e6dccb 9px, #dccfba 9px, #dccfba 18px); color: #6f6a62; box-shadow: 0 3px 0 var(--ink); cursor: not-allowed; }
.opt.lock b::before { content: "\1F512\00a0"; }
.opt.tog.on { background: #fff; border-color: var(--c); box-shadow: 0 5px 0 var(--c), inset 0 0 0 3px var(--c); }
.callout { margin-top: 14px; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; font-weight: 700; background: #f8d9d3; animation: shake .4s ease; }
.after { margin-top: 20px; padding: 14px 18px; background: #fff; border: 3px dashed var(--ink); border-radius: 16px; font-size: 18px; font-weight: 700; }
.actions { display: flex; gap: 12px; margin-top: 20px; }
.ticket { padding: 16px 16px 18px; position: relative; background: #fff; }
.ticket h4 { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #6f6a62; margin-bottom: 10px; }
.ln { display: block; margin-bottom: 8px; font-weight: 600; font-size: 16px; }
.ln small { display: inline-block; font-family: var(--display); font-weight: 600; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: #fff; background: var(--ink); border-radius: 6px; padding: 0 7px; margin-right: 6px; vertical-align: 1px; }
.ln.new { animation: rise .45s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.empty { color: #8a847a; font-style: italic; font-weight: 600; }
.userq { display: inline-block; background: #efe6d4; border: 2.5px solid var(--ink); border-radius: 14px 14px 14px 4px; padding: 4px 12px; font-weight: 700; margin-bottom: 12px; }
.userq.two { margin-top: 4px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* result */
.res .tagline { font-family: var(--display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #6f6a62; margin: 22px 0 4px; }
.res h2 { font-size: clamp(42px, 8vw, 80px); line-height: .95; color: var(--paper); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); transform: rotate(-1.5deg); display: inline-block; }
.goalline { display: inline-block; margin-top: 14px; font-family: var(--display); font-weight: 700; font-size: 20px; border: 3px solid var(--ink); border-radius: 12px; padding: 4px 16px; box-shadow: 0 4px 0 var(--ink); }
.goalline.ok { background: #bfe3b4; } .goalline.no { background: #f6c6bd; }
.desc { margin-top: 16px; font-size: 20px; font-weight: 700; max-width: 34em; }
.twobars { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 28px 0 8px; }
.twobars .belief .bar .fill.rel { background: var(--slate); }
.sect { margin-top: 44px; }
.sect > h3 { font-size: 30px; margin-bottom: 14px; }
.tbl-scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border: 3px solid var(--ink); border-radius: 16px; overflow: hidden; box-shadow: 0 5px 0 var(--ink); font-weight: 600; font-size: 16px; }
.tbl th, .tbl td { padding: 10px 14px; text-align: left; border-bottom: 2px solid #e4dac6; vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th { font-family: var(--display); font-size: 13px; letter-spacing: .07em; text-transform: uppercase; background: var(--ink); color: var(--paper); }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.warn td { background: #f8dcd6; }
.tbl .flag { font-family: var(--display); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; background: var(--rose); color: #fff; border: 2px solid var(--ink); border-radius: 6px; padding: 0 6px; margin-left: 6px; }
.pos { color: #4e8a45; font-weight: 800; } .neg { color: #b4584d; font-weight: 800; }
.truth { padding: 20px; display: grid; gap: 14px; }
.truth .row { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: start; }
.badge { display: inline-block; font-family: var(--display); font-weight: 600; font-size: 13px; border: 2.5px solid var(--ink); border-radius: 999px; padding: 1px 12px; }
.badge.good { background: #bfe3b4; } .badge.bad { background: #f6c6bd; } .badge.vague { background: #f3deaa; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.cmp .col { padding: 18px; }
.cmp h4 { font-size: 22px; margin-bottom: 6px; }
.cmp ul { margin: 8px 0 0; padding-left: 18px; font-weight: 600; font-size: 15px; color: #5d5850; }
.qs { display: grid; gap: 12px; counter-reset: q; padding: 0; list-style: none; margin: 0; }
.qs li { padding: 14px 18px 14px 64px; position: relative; font-size: 19px; font-weight: 700; }
.qs li::before { counter-increment: q; content: counter(q); position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; display: grid; place-items: center; background: var(--rose); color: #fff; border: 3px solid var(--ink); border-radius: 50%; font-family: var(--display); font-size: 20px; }
.qs.hab li b { display: block; font-family: var(--display); font-weight: 600; font-size: 20px; }
.qs.hab li span { font-weight: 600; font-size: 15px; color: #5d5850; }
.endrow { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 44px; }
.confetti { position: fixed; top: -14px; width: 10px; height: 16px; z-index: 50; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .9; } }

@media (max-width: 860px) {
  .idgrid, .how, .twobars, .cmp, .below { grid-template-columns: 1fr; }
  .hud { grid-template-columns: 1fr; }
  .talk { grid-template-columns: 56px 1fr; }
  .avatar { width: 56px; height: 56px; }
  .say { font-size: 17px; }
}

/* ---- full-frame layout ---- */
html, body { overflow-x: hidden; }
.wrap { max-width: none; padding: 0; overflow-x: clip; }
.pad { padding: 0 clamp(16px, 4vw, 64px) 56px; }
.pad .topbar { padding-top: 16px; }
svg.scene { overflow: visible; }
.game { position: relative; display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-height: 560px; overflow: hidden; background: #b8d8e3; }
.rhero { position: relative; display: flex; flex-direction: column; height: min(46vw, 620px); min-height: 440px; overflow: hidden; border-bottom: 4px solid var(--ink); background: #b8d8e3; }
.hudbar { position: relative; flex: none; order: -1; z-index: 5; display: grid; grid-template-columns: 1fr minmax(260px, 520px) 1fr; align-items: center; gap: 14px; padding: 12px clamp(12px, 3vw, 40px); }
.scenebox { position: relative; flex: 1 1 0; min-height: 0; }
.scenebox svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hudbar .brand { background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 4px 14px; box-shadow: 0 4px 0 var(--ink); justify-self: start; font-size: 20px; white-space: nowrap; }
.hudbar .belief { padding: 6px 14px 10px; }
.hudbar .belief .lab { font-size: 13px; } .hudbar .belief .lab span { font-size: 22px; }
.hudbar .bar { height: 16px; margin-top: 6px; }
.hudr { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
.hudr .likes { padding: 4px 12px; font-size: 20px; }
.sheet { position: relative; flex: none; z-index: 6; height: clamp(300px, 40vh, 430px); overflow-y: auto; background: var(--paper); border-top: 4px solid var(--ink); border-radius: 26px 26px 0 0; padding: 14px clamp(14px, 3vw, 44px) 20px; }
.sheetin { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 330px); gap: 24px; max-width: 1500px; margin: 0 auto; align-items: start; }
.sheet .crumbs { margin: 0 0 10px; }
.sheet .opts { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.sheet .prompt { margin: 12px 0 8px; font-size: 18px; }
.sheet .ticket { position: sticky; top: 0; box-shadow: 0 4px 0 var(--ink); max-height: 100%; }
.sheet .say { font-size: 18px; padding: 12px 16px; }
.sheet .after { margin-top: 12px; }
.sheet .actions { margin-top: 14px; }
.introsheet { text-align: center; display: grid; justify-items: center; align-content: center; gap: 6px; padding-top: 18px; padding-bottom: 22px; }
.introsheet .title { font-size: clamp(44px, 7vw, 84px); margin: 0 0 2px; }
.introsheet .lead { margin: 6px auto 12px; font-size: clamp(16px, 1.9vw, 21px); }
.introrow { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }
.introrow .fine { margin: 0; }
.res { max-width: 1240px; margin: 0 auto; }
.res .tagline { margin-top: 30px; }
.idgrid { gap: clamp(16px, 2.4vw, 32px); }
.shake { animation: shake .4s ease; }

@media (max-width: 860px), (max-aspect-ratio: 1/1) {
  .game { height: auto; min-height: 0; overflow: visible; background: var(--bg); }
  .scenebox { flex: none; aspect-ratio: 900 / 402; width: 100%; max-height: 380px; }
  .hudbar { grid-template-columns: 1fr; gap: 8px; background: var(--bg); padding: 10px 14px; order: -1; }
  .hudbar .brand { display: none; }
  .hudr { justify-content: space-between; }
  .sheet { height: auto; border-radius: 0; overflow: visible; }
  .sheetin { grid-template-columns: 1fr; }
  .sheet .ticket { position: static; }
  .rhero { height: auto; min-height: 0; }
}

/* ---- scene life ---- */
@keyframes fly { from { transform: translateX(-120px); } to { transform: translateX(1100px); } }
@keyframes flagsway { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
@keyframes flagr { 0%, 100% { transform: skewY(-5deg) scaleX(1); } 50% { transform: skewY(5deg) scaleX(.85); } }
@keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
@keyframes puff { 0% { transform: translateY(0) scale(.5); opacity: 0; } 25% { opacity: .85; } 100% { transform: translateY(-34px) scale(1.4); opacity: 0; } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.bird { animation: fly 26s linear infinite; }
.bird.b { animation-duration: 36s; animation-delay: -14s; }
.bird.c { animation-duration: 31s; animation-delay: -5s; }
.flag { transform-box: fill-box; transform-origin: 50% 0; animation: flagsway 2.4s ease-in-out infinite; }
.flagr { transform-box: fill-box; transform-origin: 0% 50%; animation: flagr 1.8s ease-in-out infinite; }
.bulb, .glow { animation: tw 2.6s ease-in-out infinite; }
.puff { transform-box: fill-box; transform-origin: 50% 100%; animation: puff 4.4s ease-out infinite; }
.puff.p2 { animation-delay: -2.2s; }
.blink { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.6s infinite; }
.cloud.c { animation-duration: 23s; }

        S.round += 1; S.phase = "choose"; S.msg = ""; S.pop = null; S.mood = "neutral"; S.chatter = []; softRender(); return;
      }
      if (S.step >= steps.length - 1 && !(steps[S.step] === "explain" && S.ch.explain === "t2")) { S.round = 1; S.phase = "choose"; S.msg = ""; S.pop = null; S.mood = "neutral"; S.chatter = []; render(); return; }
      S.step += 1; S.chatter = []; S.phase = "choose"; S.msg = ""; S.lastLine = -1; S.pop = null; S.mood = "neutral"; softRender();
    }
  });

  app.addEventListener("mouseover", function (e) { var t = e.target.closest ? e.target.closest(".tile") : null; if (t) selectCostume(t.getAttribute("data-id")); });
  app.addEventListener("focusin", function (e) { var t = e.target.closest ? e.target.closest(".tile") : null; if (t) selectCostume(t.getAttribute("data-id")); });
  app.addEventListener("dblclick", function (e) { var t = e.target.closest ? e.target.closest(".tile") : null; if (t) { S.id = t.getAttribute("data-id"); S.screen = "question"; render(); } });
  app.addEventListener("submit", function (e) {
    var f = e.target.closest ? e.target.closest("[data-form=ask]") : null;
    if (!f) return;
    e.preventDefault();
    askLive(f.querySelector("input").value);
  });

  var lastPortrait = !!(window.matchMedia && window.matchMedia("(max-aspect-ratio: 1/1)").matches);
  window.addEventListener("resize", function () {
    var now = !!(window.matchMedia && window.matchMedia("(max-aspect-ratio: 1/1)").matches);
    if (now !== lastPortrait) { lastPortrait = now; if (S.screen === "intro") render(); }
  });

  render();
})();
</script>
</body>
</html>
